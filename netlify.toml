redirectsOrigin = "config"
plugins = []

[functions]
  [functions."*"]

[build]
  publish = "dist"
  publishOrigin = "config"
  commandOrigin = "config"
  command = "npx vite build"

  [build.environment]
  [build.processing]
  [build.processing.css]
  [build.processing.html]
  [build.processing.images]
  [build.processing.js]
  [build.services]

# ── Presmerovania ───────────────────────────────────────────────
# Poradie je dôležité: Netlify použije PRVÉ pravidlo, ktoré sedí.
# SPA pravidlo "/*" musí byť vždy POSLEDNÉ.

# Dynamická sitemap – generuje ju funkcia netlify/functions/sitemap.js zo Supabase
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# Starý odkaz, ktorý má Google zaindexovaný (iPhone 12 mini je 64GB)
[[redirects]]
  from = "/eshop/iphone-12-mini-128gb-white"
  to = "/eshop/iphone-12-mini-64gb-white"
  status = 301
  force = true

# SPA – React Router (musí byť posledné)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://assets.mailerlite.com https://preview.mailerlite.io https://cdn.jsdelivr.net https://www.google.com https://www.gstatic.com https://maps.googleapis.com https://maps.gstatic.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://assets.mailerlite.com https://fonts.googleapis.com https://maps.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https: blob: https://maps.googleapis.com https://maps.gstatic.com https://*.googleusercontent.com https://www.google-analytics.com https://ssl.gstatic.com https://i.ytimg.com; frame-src 'self' https://preview.mailerlite.io https://assets.mailerlite.com https://www.google.com https://maps.google.com https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' https://assets.mailerlite.com https://preview.mailerlite.io https://*.mailerlite.io https://maps.googleapis.com https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://pacedozzqdgscxxkgimc.supabase.co https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self' https://assets.mailerlite.com https://www.google.com;"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/ebook-7-trikov"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "private, no-cache, no-store, must-revalidate"